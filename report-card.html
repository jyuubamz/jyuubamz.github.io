<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collector Report Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: playful collectible, crisp like a printed ID card
   IDEA: a photocard / member ID card that becomes a collector's report card
   PICTURE: the card itself, generated from a username search, full breakdown table under it
   COLOUR and TYPE: near-black stage, signal yellow card, black ink; Inter Tight + a signature script
   LAYOUT: search on top, card centred, table below; one column at every width */
:root{color-scheme:dark;--bg:#151515;--ink:#f2f2f2;--muted:#9a9a9a;--yellow:#75FB4C;--card-ink:#111;--line:#1a1a1a;--sans:"Inter Tight","Helvetica Neue",Arial,"PingFang SC","Hiragino Sans","Apple SD Gothic Neo","Noto Sans CJK SC","Malgun Gothic",sans-serif}
*{box-sizing:border-box;min-width:0}
body{margin:0;transition:none;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);overflow-x:clip}
main{max-width:580px;margin:0 auto;padding:clamp(20px,4vw,40px) 16px 56px}
h1{font-size:clamp(26px,5vw,34px);line-height:1.05;margin:0 0 6px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 18px;font-size:15px}
form{display:flex;gap:8px;position:relative}
.field{flex:1;position:relative}
input{width:100%;font:inherit;font-size:16px;padding:12px 14px;min-height:48px;border-radius:12px;border:1px solid #333;background:#1f1f1f;color:var(--ink)}
input:focus,button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
button{font:inherit;font-weight:600;min-height:48px;padding:0 18px;border-radius:12px;border:0;background:var(--yellow);color:#111;cursor:pointer}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#1f1f1f;border:1px solid #333;border-radius:12px;list-style:none;margin:0;padding:4px;z-index:5;max-height:300px;overflow:auto}
.sugg:empty{display:none}
.sugg li{padding:10px 12px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.sugg li small{color:var(--muted);white-space:nowrap}
.sugg li[aria-selected=true],.sugg li:hover{background:#2c2c2c}
.tabs{display:flex;gap:6px;margin:0 0 14px}
.tabs button{min-height:44px;background:#242424;color:var(--ink);border:1px solid #333;font-weight:600}
.tabs button[aria-selected=true]{background:var(--yellow);color:#111;border-color:transparent}
.status{font-size:13px;color:var(--muted);min-height:20px;margin:10px 0 18px}
.status.err{color:#ff8a7a}

/* ---- card ---- */
.stage{display:flex;justify-content:center}
.card{width:min(100%,460px);background:#fff;border-radius:28px;padding:44px 44px 44px 0;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.panel{position:relative;background:var(--yellow);color:var(--card-ink);border-radius:0 16px 16px 0;padding:26px 54px 22px 26px;min-height:600px;display:flex;flex-direction:column}
.side{position:absolute;right:12px;top:22px;bottom:22px;display:flex;flex-direction:row;justify-content:space-between;align-items:center;writing-mode:vertical-rl;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;gap:12px}
.side span{overflow:hidden;text-overflow:ellipsis}
.logo{height:60px;width:auto;align-self:flex-start;margin-bottom:16px}
.row{border-top:1.2px solid var(--line);padding:6px 0 4px}
.lab{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.02em}
.val{font-size:clamp(30px,8vw,42px);font-weight:600;line-height:1.1;letter-spacing:-.02em;overflow-wrap:anywhere}
.val.s{font-size:clamp(24px,6vw,32px)}.val.xs{font-size:clamp(20px,5vw,26px)}
.out{color:transparent;-webkit-text-stroke:1.2px var(--card-ink);font-weight:500}
.none{opacity:.45}
.stats{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:14px}
.stat{border-top:1.2px solid var(--line);padding:6px 0 8px}
.stat .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .ln{display:flex;justify-content:space-between;gap:6px;font-size:13px;line-height:1.35}
.stat .ln b{font-size:17px}
@media(max-width:440px){.stats{grid-template-columns:minmax(0,1fr)}}
.bar{height:5px;border:1px solid var(--line);margin-top:5px;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--card-ink);width:0;transition:width .8s ease}
.more{font-size:12px;border-top:1.2px solid var(--line);padding:6px 0}
.bottom{display:grid;grid-template-columns:minmax(0,1fr) 38%;border-top:1.2px solid var(--line);border-bottom:1.2px solid var(--line);margin-top:auto;min-height:130px}
.sig{border-right:1.2px solid var(--line);padding:8px 8px 6px 0;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.sig .remark{font-size:12px;line-height:1.35}
.box{background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:6px}
.box .big{font-size:56px;font-weight:700;line-height:1}
.box small{font-size:11px;line-height:1.25;text-transform:uppercase;margin-top:4px}
.foot{font-size:11px;margin-top:14px}
.empty{color:var(--muted);text-align:center;padding:40px 0;border:1px dashed #333;border-radius:20px;width:min(100%,460px)}

/* ---- breakdown table ---- */
h2{font-size:20px;margin:36px 0 10px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 6px;border-bottom:1px solid #2a2a2a;text-align:left}
th{color:var(--muted);font-weight:500;font-size:13px}
td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td .gap{display:block;color:var(--muted);font-size:12px}
.t10{color:var(--yellow);font-weight:700}
.note{font-size:13px;color:var(--muted);margin-top:26px}
.note code{color:var(--ink)}
@media(max-width:420px){.card{padding:26px 26px 26px 0;border-radius:22px}.panel{padding:20px 44px 18px 18px;min-height:520px}.stats{column-gap:10px}table{font-size:13px}}
@media(prefers-reduced-motion:no-preference){.card.pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.2)}@keyframes pop{from{transform:translateY(16px) rotate(-2deg) scale(.96);opacity:0}}}
</style>
</head>
<body>
<main>
  <h1>Collector report card</h1>
  <p class="sub">Search a username to see their Objekt and Grid placings.</p>
  <div class="tabs" id="tabs" role="tablist"></div>
  <form id="f" autocomplete="off">
    <div class="field">
      <input id="q" placeholder="Type a username…" aria-label="Username" role="combobox" aria-controls="sugg" aria-expanded="false">
      <ul class="sugg" id="sugg" role="listbox"></ul>
    </div>
    <button type="submit">Generate</button>
  </form>
  <div class="status" id="status">Loading leaderboard…</div>
  <div class="stage" id="stage"><div class="empty">Your card will appear here</div></div>
  <div id="detail"></div>
  <p class="note" id="note">Draft preview using a sample cut of your leaderboard. To connect the live sheet, set each season's <code>CSV_URL</code> or <code>SHEET_ID</code> at the bottom of the file.</p>
</main>

<script>
{
/* ================= SETTINGS =================
   Easiest: in Google Sheets, File → Share → Publish to web → pick the leaderboard tab → "Comma-separated values (.csv)" → Publish.
   Paste that link into CSV_URL.
   Or: share the sheet as "Anyone with the link can view" and paste the ID (the part between /d/ and /edit) into SHEET_ID. */
const SEASONS = [
  { id:"binary02", name:"Binary", num:"02", color:"#75FB4C", CSV_URL:"", SHEET_ID:"1BUUwNM6oeN1TmTY5p16knKeDRTgMWwKTC05H5H-N9Ms", SHEET_NAME:"BINARY02 FULL COMPLETE DATA" },
  { id:"cream02",  name:"Cream",  num:"02", color:"#ff7477", CSV_URL:"", SHEET_ID:"1Cu2aQNeb2A829U8DQRN37wQ4d31x6QNVkSxIPvFGNlo", SHEET_NAME:"AS OF 23 Nov 00:01 KST" }
];
const CONFIG = { CARD_BOARDS: 6 };   // member boards shown on the card (the rest are in the table)

/* ---------- read the sheet layout ----------
   Expects blocks of 3 columns: rank (P1…), username, score.
   Above them: a section row (Overall / member name), a type row (Objekt / Grid),
   and optional "10th Place:" / "100th Place:" threshold rows. */
const isRank = s => /^P\d+$/i.test((s||'').trim());
function parseBoards(g){
  const W = Math.max(...g.map(r=>r.length));
  const cell=(r,c)=>((g[r]||[])[c]||'').trim();
  let first=-1; const rankCols=new Set();
  g.forEach((row,r)=>row.forEach((v,c)=>{ if(isRank(v)){ rankCols.add(c); if(first<0||r<first) first=r; } }));
  if(first<0) throw new Error('No rank column (P1, P2…) found');
  const typeRow=[...Array(first).keys()].find(r=>g[r].some(v=>/^(objekt|grid)$/i.test((v||'').trim())));
  const leftLabel=(r,c)=>{ if(r==null||r<0) return ''; for(let x=c;x>=0;x--){ const v=cell(r,x); if(v) return v; } return ''; };
  const boards=[];
  [...rankCols].sort((a,b)=>a-b).forEach(c=>{
    const type=leftLabel(typeRow,c)||'Score';
    const section=typeRow>0?leftLabel(typeRow-1,c):'Board';
    const th={};
    for(let r=0;r<first;r++){ const m=(cell(r,c)+' '+cell(r,c+1)).match(/(\d+)\s*(st|nd|rd|th)\s*place/i); if(m){ const n=num(cell(r,c+2)); if(!isNaN(n)) th[m[1]]=n; } }
    const entries=[];
    for(let r=first;r<g.length;r++){ const rk=cell(r,c), name=cell(r,c+1); if(isRank(rk)&&name) entries.push({rank:+rk.slice(1),name,score:num(cell(r,c+2))}); }
    boards.push({section,type,th,entries,top:entries[0]?.score||0});
  });
  return boards;
}
const num=s=>+String(s).replace(/[,\s]/g,'');
function parseCSV(t){
  const out=[];let row=[],cell='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c=='"')q=true;else if(c==','){row.push(cell);cell=''}
    else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(cell);out.push(row);row=[];cell=''}
    else cell+=c}
  if(cell||row.length){row.push(cell);out.push(row)}
  return out;
}

/* ---------- sample cut (from your screenshot, top 15; Member B/C are made-up fillers) ---------- */
function sampleGrid(){

    ['Overall','Grid',590,null,L('Ravenant:2284|Simioun:2075|tomSanS4:1537|Gorgeous:845|Dinner:775|farming:753|BlueIce:724|LMOCHSSS:712|magpieS:641|BesTisMOchiZ:590|SoupRKnowva:519|Suremy:507|SirReach:441|Taegu:382|mrbakchoi888:374')],

    ['SeoYeon','Grid',102,null,L('Gorgeous:236|TakaBoom:200|chungsubin:161|햄앤치즈:136|littlepochacco:117|為什麼要演奏春日影:117|LOONASASAS:110|reiiiinmyheart:108|Simioun:103|boundy:102|BegoodtoTPS:95|Ravenant:86|Amoz:79|홍시햄햄:66|Riveri:62')],
    ['Member B','Objekt',640,90,L('Ravenant:1420|Zixu:1210|Simioun:980|magpieS:902|Suremy:850|Dinner:812|farming:760|Gorgeous:701|Taegu:688|BlueIce:640|TaraGauri:610|Miniboy4:577|pancakewav:540|Breeze1220:512|LMOCHSSS:498')],
    ['Member B','Grid',60,null,L('Zixu:150|Ravenant:141|Simioun:120|Dinner:98|magpieS:91|farming:80|Suremy:77|Taegu:70|BlueIce:66|Gorgeous:60|Miniboy4:58|TaraGauri:51|SirReach:47|pancakewav:40|LMOCHSSS:38')],
    ['Member C','Objekt',520,70,L('LMOCHSSS:1302|Simioun:1190|tomSanS4:1101|Ravenant:990|Gorgeous:870|BlueIce:801|Breeze1220:720|Zixu:655|farming:590|Suremy:520|magpieS:498|Dinner:470|TaraGauri:450|Taegu:420|pancakewav:401')],
    ['Member C','Grid',48,null,L('tomSanS4:130|LMOCHSSS:122|Simioun:101|Gorgeous:90|Ravenant:84|BlueIce:70|Breeze1220:62|farming:55|Zixu:50|magpieS:48|Suremy:44|Dinner:40|Taegu:35|TaraGauri:31|SirReach:28')]
  ];
  const g=Array.from({length:5+15},()=>[]);
  blocks.forEach(([sec,type,t10,t100,list],b)=>{
    const c=b*3, prev=blocks[b-1];
    if(!prev||prev[0]!==sec) g[1][c]=sec;
    g[2][c]=type; g[3][c]='10th Place:'; g[3][c+2]=String(t10);
    if(t100){ g[4][c]='100th Place:'; g[4][c+2]=String(t100); }
    list.forEach(([n,v],i)=>{ g[5+i][c]='P'+(i+1); g[5+i][c+1]=n; g[5+i][c+2]=v; });
  });
  return g.map(r=>Array.from({length:blocks.length*3},(_,i)=>r[i]||''));
}

/* ---------- app ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>isNaN(n)?'–':n.toLocaleString('en-US');
let boards=[], users=[]; // users: [{name, lower, best}]

function index(){
  const m=new Map();
  boards.forEach(b=>b.entries.forEach(e=>{ const k=e.name.toLowerCase(); const u=m.get(k)||{name:e.name,lower:k,best:1e9,count:0}; u.best=Math.min(u.best,e.rank); u.count++; m.set(k,u); }));
  users=[...m.values()];
}
const find=(b,lower)=>b.entries.find(e=>e.name.toLowerCase()===lower);

function profile(lower){
  const sections=[]; const map=new Map();
  boards.forEach(b=>{ if(!map.has(b.section)){ const s={name:b.section,boards:{}}; map.set(b.section,s); sections.push(s); } map.get(b.section).boards[b.type]={b,e:find(b,lower)}; });
  return sections;
}
const pick=(s,re)=>{ const k=Object.keys(s.boards).find(t=>re.test(t)); return k?s.boards[k]:null; };

function rankVal(x,cls){
  if(!x||!x.e) return `<div class="val ${cls} none">Unranked</div>`;
  return `<div class="val ${cls}">P${x.e.rank}<span class="out"> ${fmt(x.e.score)}</span></div>`;
}
function line(lbl,x){ return `<div class="ln"><span>${lbl}</span>${x&&x.e?`<span><b>P${x.e.rank}</b> · ${fmt(x.e.score)}</span>`:'<span class="none">–</span>'}</div>`; }

function render(u){
  const secs=profile(u.lower);
  const overall=secs.find(s=>/overall|total/i.test(s.name))||secs[0];
  const members=secs.filter(s=>s!==overall).map(s=>{
    const o=pick(s,/objekt/i), gr=pick(s,/grid/i);
    const best=Math.min(o&&o.e?o.e.rank:1e9, gr&&gr.e?gr.e.rank:1e9);
    return {s,o,gr,best};
  }).filter(m=>m.best<1e9).sort((a,b)=>a.best-b.best);
  const all=boards.map(b=>({b,e:find(b,u.lower)})).filter(x=>x.e);
  const top10=all.filter(x=>x.e.rank<=10).length;
  const bestB=all.slice().sort((a,b)=>a.e.rank-b.e.rank||b.e.score-a.e.score)[0];
  const nameCls=u.name.length>16?'xs':u.name.length>10?'s':'';
  const shown=members.slice(0,CONFIG.CARD_BOARDS);

function search(term){
  const t=term.trim().toLowerCase(); if(!t) return;
  const u=users.find(x=>x.lower===t)||users.filter(x=>x.lower.includes(t)).sort((a,b)=>a.best-b.best)[0];
  closeSugg();
  if(u){ $('q').value=u.name; render(u); setStatus(`Showing ${u.name}`); }
  else setStatus(`"${term}" isn't on any board yet.`,true);
}
function setStatus(m,err){ $('status').textContent=m; $('status').className='status'+(err?' err':''); }

/* suggestions */
let sel=-1, list=[];
function showSugg(){
  const t=$('q').value.trim().toLowerCase();
  list=t?users.filter(u=>u.lower.includes(t)).sort((a,b)=>(b.lower.startsWith(t)-a.lower.startsWith(t))||a.best-b.best).slice(0,8):[];
  sel=-1; drawSugg();
}
function drawSugg(){
  $('sugg').innerHTML=list.map((u,i)=>`<li role="option" data-i="${i}" aria-selected="${i===sel}">${esc(u.name)}<small>best P${u.best}</small></li>`).join('');
  $('q').setAttribute('aria-expanded',list.length?'true':'false');
}
function closeSugg(){ list=[]; drawSugg(); }
$('q').addEventListener('input',showSugg);
$('q').addEventListener('keydown',e=>{
  if(!list.length) return;
  if(e.key==='ArrowDown'){ sel=(sel+1)%list.length; drawSugg(); e.preventDefault(); }
  else if(e.key==='ArrowUp'){ sel=(sel-1+list.length)%list.length; drawSugg(); e.preventDefault(); }
  else if(e.key==='Enter'&&sel>=0){ e.preventDefault(); search(list[sel].name); }
  else if(e.key==='Escape') closeSugg();
});
$('sugg').addEventListener('mousedown',e=>{ const li=e.target.closest('li'); if(li){ e.preventDefault(); search(list[+li.dataset.i].name); } });
$('q').addEventListener('blur',()=>setTimeout(closeSugg,100));
$('f').addEventListener('submit',e=>{ e.preventDefault(); search($('q').value); });

let season=SEASONS[0]; const cache={};
function drawTabs(){ $('tabs').innerHTML=SEASONS.map(x=>`<button type="button" role="tab" data-id="${x.id}" aria-selected="${x===season}">${esc(x.name)}${esc(x.num)}</button>`).join(''); }
$('tabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) location.hash=b.dataset.id; });
async function loadSeason(id){
  const prev=$('q').value.trim();
  season=SEASONS.find(x=>x.id===id)||SEASONS[0];
  document.documentElement.style.setProperty('--yellow',season.color);
  drawTabs(); closeSugg();
  const label=season.name+season.num;
  if(!cache[season.id]){
    const url=season.CSV_URL||(season.SHEET_ID?`https://docs.google.com/spreadsheets/d/${season.SHEET_ID}/gviz/tq?tqx=out:csv&headers=0&sheet=${encodeURIComponent(season.SHEET_NAME)}`:'');
    let msg;
    if(url){
      setStatus(`Loading ${label}…`);
      try{ const res=await fetch(url,{cache:'no-store'}); if(!res.ok) throw new Error(res.status);
        const b=parseBoards(parseCSV(await res.text())); cache[season.id]={boards:b,live:true}; }
      catch(err){ msg=`Couldn't read the ${label} sheet (${err.message}). Showing sample data instead.`; }
    } else msg=`${label} sheet not linked yet · showing sample data (try Simioun, Gorgeous or Ravenant)`;
    if(!cache[season.id]) cache[season.id]={boards:parseBoards(sampleGrid()),live:false,msg};
  }
  const c=cache[season.id]; boards=c.boards; index();
  const target=users.find(u=>u.lower===prev.toLowerCase())||(!c.live&&users.find(u=>u.lower==='simioun'));
  if(target) search(target.name);
  else { $('stage').innerHTML='<div class="empty">Search a username to make their card</div>'; $('detail').innerHTML=''; }
  setStatus(c.live?`${label} · ${users.length.toLocaleString()} collectors across ${boards.length} boards`:c.msg,!c.live&&c.msg.startsWith("Couldn't"));
  $('note').hidden=SEASONS.every(x=>x.CSV_URL||x.SHEET_ID);
}
addEventListener('hashchange',()=>loadSeason(location.hash.slice(1)));
loadSeason(location.hash.slice(1));
}
</script>
